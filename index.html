<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ryland Gross is a mathematics student interested in formalization, AI for Math, and commutative algebra." />
  <title>Ryland Gross</title>
  <link rel="stylesheet" href="styles.css?v=20261121c" />
  <script>
    (() => {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("theme");
      } catch (_) {
        // Use the system preference when storage is unavailable.
      }

      const theme = savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="index.html">Ryland Gross</a>
      <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <span class="theme-toggle-thumb" aria-hidden="true"></span>
      </button>
    </header>

    <main class="home-layout">
      <div class="home-intro">
        <p>
          I am a mathematics student interested in formalization, AI for Math, and commutative algebra.
          I am currently at Imperial College London and recently graduated from Harvard College.
        </p>
        <p>Email: rylandgross[at]college.harvard.edu</p>
      </div>
      <img class="profile-photo" src="kazbegi.jpg" width="2048" height="1536" alt="Ryland Gross standing in a mountain valley near Kazbegi" />
    </main>
  </div>
  <script src="theme.js?v=20260926c" defer></script>
</body>
</html>
